<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Virtual world</title>
    </head>

    <body onload="main()">
        <canvas id="webgl" width="800" height="800">
        Please use the browser supporting "canvas".
        </canvas>
        <div>

        <div id = "numdot"> XXX</div>
        <div>
            <button type="button" id="normOn">Normal On</button>
            <button type="button" id="normOff">Normal Off</button>
        </div>
        <div>
            <button type="button" id="lightOn">Light On</button>
            <button type="button" id="lightOff">Light Off</button>
            <button type="button" id="spotOn">Spotlight On</button>
            <button type="button" id="spotOff">Spotlight Off</button>
        </div>
        <div>
            Light X <input type="range" min = "-250" max = "250" value = "0" class = "slider" id = "lightSlideX">
            Light Y <input type="range" min = "-250" max = "250" value = "100" class = "slider" id = "lightSlideY">
            Light Z <input type="range" min = "-250" max = "250" value = "-200" class = "slider" id = "lightSlideZ">
        </div>
        <div>
            <button type="button" id="animOn">Animation On</button>
            <button type="button" id="animOff">Animation Off</button>
        </div>
        <div>
            Left ear <input type="range" min = "0" max = "45" value = "0" class = "slider" id = "leftESlide">
            Animation: <button type="button" id = "onB">ON</button>
            <button type="button" id = "offB">OFF</button>
        </div>
        <div>
            Right ear <input type="range" min = "0" max = "45" value = "0" class = "slider" id = "rightESlide">
        </div>
        <div> 
            Lower mouth <input type="range" min = "-10" max = "0" value = "0" class = "slider" id = "lowMSlide">
        </div>
        <div>
            Left arm <input type="range" min = "-10" max = "70" value = "0" class = "slider" id = "leftArmSlide">
        </div>
        <div>
            Left arm forearm <input type="range" min = "-10" max = "110" value = "-10" class = "slider" id = "leftForeArmSlide">
        </div>
        <div>
            Left hand <input type="range" min = "-10" max = "80" value = "-10" class = "slider" id = "leftHandSlide">
        </div>
        <div>
            Right arm <input type="range" min = "-45" max = "0" value = "90" class = "slider" id = "rightArmSlide">
        </div>
        <div>
            Right forearm <input type="range" min = "-10" max = "0" value = "180" class = "slider" id = "rightForeArmSlide">
        </div>
        <div>
            Right hand <input type="range" min = "-45" max = "45" value = "10" class = "slider" id = "rightHandSlide">
        </div>
        <div>
            Left foot <input type="range" min = "-10" max = "7" value = "-10" class = "slider" id = "leftFootSlide">
        </div>
        <div>
            Right foot <input type="range" min = "-10" max = "7" value = "-10" class = "slider" id = "rightFootSlide">
        </div>
        <div>
            Camera Angle <input type="range" min = "-360" max = "360" value = "5" class = "slider" id = "cameraSlide">
        </div>

        <script src="lib/webgl-utils.js"></script>
        <script src="lib/webgl-debug.js"></script>
        <script src="lib/cuon-utils.js"></script>
        <script src="lib/cuon-matrix-cse160.js"></script>

        <script src="lib/camera.js"></script>
        <script src="lib/Cube.js"></script>
        <script src="lib/Sphere.js"></script>
        <script src="lib/Triangle.js"></script>
        <script src="lib/Model.js"></script>

        <script src="asgn4.js"></script>
    </body>
</html>
